name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libglib2.0-0 libxcb-cursor0
      - run: uv sync
      - run: uv run pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Check the tag matches the package version
        shell: bash
        run: |
          v=$(uv run python -c "import lumen; print(lumen.__version__)")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
      - run: uv run python scripts/build.py --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-${{ runner.os }}
          path: dist/lumen-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
