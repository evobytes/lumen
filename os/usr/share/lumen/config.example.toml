# Lumen configuration example (linux defaults).
# GENERATED by scripts/docgen from internal/config. Do not edit by hand:
# change the struct tags in internal/config/config.go and run "make docs".
#
# Every value shown is the built-in default; uncomment a line to change it.
# Copy this file to the per-user location (the -config flag overrides it):
#   Windows  %APPDATA%\\Lumen\\config.toml
#   Linux    ~/.config/Lumen/config.toml
# Precedence: defaults < this file < LUMEN_* environment < flags.
# Each key has an environment variable, LUMEN_<SECTION>_<KEY> (LUMEN_SERVER_LISTEN).
# Keep secrets out of this file; prefer the environment for anything sensitive.

[server]
# Listen address as host:port for the web API, the control page and the
# output page. Keep it on loopback unless auth.token is set; use port 0 for
# any free port.
# listen = "127.0.0.1:8765"
# Maximum time to read the request headers.
# read_header_timeout = "5s"
# Grace period to drain in-flight requests when quitting.
# shutdown_timeout = "5s"

[auth]
# Shared secret required on /api/v1 as the X-API-Token header or an
# Authorization: Bearer header. Empty disables the check, which is allowed
# only while server.listen is on loopback. Prefer the LUMEN_AUTH_TOKEN
# environment variable to writing it in this file.
# token = ""

[output]
# Where the output window starts: auto (the first non-primary monitor, else
# a floating window), floating, or a monitor id such as \\.\DISPLAY2 as GET
# /api/v1/screens shows it.
# screen = "auto"
# How the output window is moved onto a monitor: win32 (set the native
# window rectangle directly; Windows only; the default there) or toolkit
# (the windowing toolkit's own API; the default elsewhere).
# placement = "toolkit"

[log]
# Minimum level: debug, info, warn or error.
# level = "info"
# Output format on stderr: json or text.
# format = "text"
