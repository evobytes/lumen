version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - paralleltest
    - revive
    - rowserrcheck
    - sqlclosecheck
    - tparallel
    - unconvert
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: error-return
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: unreachable-code
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, noctx] # test requests/listeners need no cancellation plumbing

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/evobytes/lumen
